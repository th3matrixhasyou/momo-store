stages:
  - build
  - test
  - release
  - deploy

variables:
  VERSION: "1.0.${CI_PIPELINE_IID}"

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"cr.yandex\":{\"auth\":\"$(echo -n "json_key:${YC_SA_JSON}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}/backend" --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" --destination "cr.yandex/${YC_REGISTRY_ID}/momo-backend:${CI_COMMIT_SHA}"

build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.14.0-debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"cr.yandex\":{\"auth\":\"$(echo -n "json_key:${YC_SA_JSON}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "${CI_PROJECT_DIR}/frontend" --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile" --destination "cr.yandex/${YC_REGISTRY_ID}/momo-frontend:${CI_COMMIT_SHA}"

test-backend:
  stage: test
  image: golang:1.23
  script:
    - cd backend
    - go test -v ./...

release-images:
  stage: release
  variables:
    DOCKER_CONFIG: /kaniko/.docker
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"cr.yandex\":{\"auth\":\"$(echo -n "json_key:${YC_SA_JSON}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
    - crane tag "cr.yandex/${YC_REGISTRY_ID}/momo-backend:${CI_COMMIT_SHA}" "${VERSION}"
    - crane tag "cr.yandex/${YC_REGISTRY_ID}/momo-backend:${CI_COMMIT_SHA}" "latest"
    - crane tag "cr.yandex/${YC_REGISTRY_ID}/momo-frontend:${CI_COMMIT_SHA}" "${VERSION}"
    - crane tag "cr.yandex/${YC_REGISTRY_ID}/momo-frontend:${CI_COMMIT_SHA}" "latest"

deploy-k8s:
  stage: deploy
  image:
    name: alpine/helm:3.14.0
    entrypoint: [""]
  script:
    - mkdir -p ~/.kube
    - echo "${KUBE_CONFIG}" | base64 -d > ~/.kube/config
    - chmod 600 ~/.kube/config
    - helm upgrade --install momo-backend ./helm/momo-store-backend --namespace default --set image.tag="${VERSION}" --wait
    - helm upgrade --install momo-frontend ./helm/momo-store-frontend --namespace default --set image.tag="${VERSION}" --wait
